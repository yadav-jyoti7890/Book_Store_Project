<div class="top-bar">
  <h2 style="font-weight: 700; font-family: Helvetica;">User Dashboard</h2>

  <div class="filter-bar" >
    <select [formControl]="filterUsers" style="border-color: black;">
      <option value>🔹All Users</option>
      <option value="admin">🛡️ Admin</option>
      <option value="user"> 👤 User</option>
    </select>

    <!-- <div class="search-box">
      <input type="text" [(ngModel)]="searchQuery" placeholder="🔍 Search...">
    </div> -->

    <!-- <button (click)="applyFilters()">✔ Apply</button> -->
    <!-- <button (click)="resetAll()">✖ Reset</button> -->
  </div>
</div>

<div class="read_task">
  <table class="table">
    <tr>
      <th>S.N</th>
      <th>profile</th>
      <th>username</th>
      <th>email</th>
      <th>role-type</th>
      <th>active</th>
      <th>action</th>
    </tr>

    <tr *ngFor="let user of usersData; let i = index">
      <td>{{i+1}} </td>
      <td>
        <img [src]="user.profile_image ? imageBaseUrl + 'uploads/' + user.profile_image : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQo2Rx5rFKLf6Rt59A_3o5HI9dmdUSLnUj4DWq24jZuDQSvC0Gz4-HmWXpPljwsz3jroYg&usqp=CAU'"
           height="60px" width="60px"
          style="border-radius: 50%;">

      </td>

      <td>{{user.user_name}}</td>
      <td>{{user.email}}</td>
      <td>{{user.role}}</td>
      <td>
        <label class="switch">
          <input type="checkbox">
          <span class="slider round"></span>
        </label>
      </td>

      <td>
        <button class="edit-btn">
          <i class="fas fa-edit"></i> Edit
        </button>
        <button (click)="deleteUser(user.user_id)"
          class="delete-btn">
          <i class="fas fa-trash"></i> Delete
        </button>
      </td>

    </tr>

  </table>
</div>
