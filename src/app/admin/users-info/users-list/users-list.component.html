<div class="wrapper">
  <div class="header">
    <h2>Users List</h2>
    <select [formControl]="filterUsers" style="border-color: black">
      <option value>🔹All Users</option>
      <option value="admin">🛡️ Admin</option>
      <option value="user">👤 User</option>
    </select>
  </div>

  <div class="table-controls">
    <div>
      Show
      <select>
        <option>10</option>
        <option>25</option>
        <option>50</option>
      </select>
      entries
    </div>
    <div>
      Search:
      <input type="text" class="search-input" placeholder="Search users..." />
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>
          Name
          <span class="sort-icons">
            <i
              class="ri-skip-up-fill"
              (click)="ascending('user_name')"
              [ngClass]="sortBy === 'user_name' && sortOrder === 'asc' ? 'active-icon' : 'inactive-icon'"
            ></i>
            <i
              class="ri-skip-down-fill"
              (click)="descending('user_name')"
              [ngClass]="sortBy === 'user_name' && sortOrder === 'desc' ? 'active-icon' : 'inactive-icon'"
            ></i>
          </span>
        </th>
        <th>Image</th>
        <th>
          Email
          <span class="sort-icons">
            <i
              class="ri-skip-up-fill"
              (click)="ascending('email')"
              [ngClass]="sortBy === 'email' && sortOrder === 'asc' ? 'active-icon' : 'inactive-icon'"
            ></i>
            <i
              class="ri-skip-down-fill"
              (click)="descending('email')"
              [ngClass]="sortBy === 'email' && sortOrder === 'desc' ? 'active-icon' : 'inactive-icon'"
            ></i>
          </span>
        </th>
        <th>Active Users</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngIf="usersData.length === 0">
        <td colspan="6" class="empty">No matching records found</td>
      </tr>

      <tr *ngFor="let users of usersData; let i = index"  [routerLink] = "['../user-detail', users.user_id]">
        <td>{{ i + 1 }}</td>
        <td>{{ users.user_name }}</td>
        <td>
          <img
            [src]="users.profile_image ? imageBaseUrl + 'uploads/' + users.profile_image : 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQo2Rx5rFKLf6Rt59A_3o5HI9dmdUSLnUj4DWq24jZuDQSvC0Gz4-HmWXpPljwsz3jroYg&usqp=CAU'"
            height="60px"
            width="60px"
            style="border-radius: 50%"
          />
        </td>
        <td>{{ users.email }}</td>
        <td>Active</td>
        <td>
          <button class="edit-btn"><i class="fas fa-edit"></i> Edit</button>
          <button class="delete-btn" (click)="deleteUser(users.user_id)">
            <i class="fas fa-trash"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Uncomment if you're using Angular Material -->
  

 
</div>

  <mat-paginator style="background-color: white; color: #000; fill: #000 !important; font-weight: 800; margin-top: 1vw;"

    [length]="totalRecords"
    [pageSize]="pageSize"
    (page)="onPageChange($event)">
  </mat-paginator>
