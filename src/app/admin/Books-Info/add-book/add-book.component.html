<div class="form_div">
  <h1><i class="ri-book-open-fill"></i> ADD <span>More Book</span></h1>
  <div class="inner_div">
    <form [formGroup]="addProductForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="form-group">
          <input
            name="title"
            placeholder="Enter Title"
            formControlName="title"
          />
          <small class="text-danger">{{ getError("title") }}</small>
        </div>

        <div class="form-group">
          <input
            name="author"
            placeholder="Enter Author"
            formControlName="author"
          />
          <small class="text-danger">{{ getError("author") }}</small>
        </div>
      </div>

      <div>
        <textarea
          name="description"
          placeholder="Enter Description"
          formControlName="description"
        ></textarea>
        <small class="text-danger">{{ getError('description') }}</small>
      </div>

      <div class="form-row">
         <div class="form-group">
          <input
          type="number"
          name="price"
          placeholder="Enter MRP Price"
          formControlName="price"
          (ngModelChange)="calculateOfferPrice()"
        />
        <small class="text-danger">{{ getError('price') }}</small>
        <select
          name="discount_type"
          formControlName="discount_type"
          (ngModelChange)="calculateOfferPrice()"
        >
          <option value="">Select Discount Type</option>
          <option value="percent">Percentage</option>
          <option value="amount">Fixed Amount</option>
        </select>
        <small class="text-danger">{{ getError('discount_type') }}</small>

        <input
          type="number"
          name="discount_value"
          placeholder="Discount Value"
          formControlName="discount_value"
          (ngModelChange)="calculateOfferPrice()"
        />
        <small class="text-danger">{{ getError("discount_value") }}</small>

        <input
          type="number"
          name="offer_price"
          formControlName="offer_price"
          placeholder="Offer Price"
          readonly
        />
         </div>
      </div>

      <div class="form-row">
        <select
          id="category"
          name="category"
          class="dropdown"
          formControlName="category_id"
        >
          <option value="">Choose Category</option>
          <option *ngFor="let category of data" [value]="category.category_id">
            {{ category.category_name }}
          </option>
        </select>
        <small class="text-danger">{{ getError('category_id') }}</small>

        <input
          type="number"
          name="stock"
          placeholder="Enter Stock"
          formControlName="stock"
        />
        <small class="text-danger">{{ getError('stock') }}</small>
      </div>

      <div class="form-row">
        <input
          type="file"
          name="image"
          placeholder="select image"
          class="same"
          (change)="onFileChange($event)"
          formControlName="image"
        />
        <small class="text-danger">{{ getError("image") }}</small>

        <input
          type="date"
          name="pub_date"
          name="publication_date"
          class="same"
          formControlName="date"
        />
        <small class="text-danger">{{ getError("date") }}</small>
      </div>

      <div class="button-container">
        <button (click)="submitProductForm()" [disabled]="addProductForm.invalid">Add Book</button>
      </div>
    </form>
  </div>
</div>
