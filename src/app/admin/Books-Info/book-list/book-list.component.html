<app-baseClass #loader></app-baseClass>

<div class="wrapper">
  <div class="header">
    <h2>Product List</h2>

    <button class="add-btn" routerLink="/admin_dashboard/add_book">
      <i class="ri-add-circle-fill"></i> Add More Category
    </button>
  </div>

  <div class="table-controls">
    <div>
      Show
      <select>
        <option>10</option>
        <option>25</option>
        <option>50</option>
      </select>
      entries
    </div>
    <div>
      Search:
      <select class="category-filter" [formControl]="categoryControl">
        <option value="">All Categories</option>
        <option
          *ngFor="let categoryItem of category"
          [value]="categoryItem.category_id"
        >
          {{ categoryItem.category_name }}
        </option>
      </select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="font-weight: 800; font-family: helvetica">S.N</th>
       <th>
          Category
          <span class="sort-icons" >
            <i class="ri-skip-up-fill" (click)="ascending('category_id')"  [ngClass]="sortBy === 'category_id' && sortOrder === 'asc' ? 'active-icon' : 'inactive-icon'"></i>
            <i class="ri-skip-down-fill" (click)="descending('category_id')" [ngClass]="sortBy === 'category_id' && sortOrder === 'desc' ? 'active-icon' : 'inactive-icon'"></i>
          </span>
        </th>
        <th>Image</th>
        <th>Title</th>
        <th>Author</th>
         <th>
          Price
          <span class="sort-icons" >
            <i class="ri-skip-up-fill" (click)="ascending('price')"  [ngClass]="sortBy === 'price' && sortOrder === 'asc' ? 'active-icon' : 'inactive-icon'"></i>
            <i class="ri-skip-down-fill" (click)="descending('price')" [ngClass]="sortBy === 'price' && sortOrder === 'desc' ? 'active-icon' : 'inactive-icon'"></i>
          </span>
        </th>
        <th>Offer Price</th>
         <th>
          created_at
          <span class="sort-icons" >
            <i class="ri-skip-up-fill" (click)="ascending('created_at')"  [ngClass]="sortBy === 'created_at' && sortOrder === 'asc' ? 'active-icon' : 'inactive-icon'"></i>
            <i class="ri-skip-down-fill" (click)="descending('created_at')" [ngClass]="sortBy === 'created_at' && sortOrder === 'desc' ? 'active-icon' : 'inactive-icon'"></i>
          </span>
        </th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let Product of data; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ Product.category_name }}</td>
        <img
            [src]="
              Product.image ? imageBaseUrl + 'uploads/' + Product.image : ''
            "
            alt="category-image"
            class="category-image"
            height="80px"
            width="100px"
            style="border-radius: 10px !important; object-fit: contain"
          />
        <td>{{ Product.title }}</td>
        <td>{{ Product.author }}</td>
        <td>{{ Product.price }}</td>
        <td>{{ Product.offer_price }}</td>
        <td>{{ Product.created_at | date : "dd MMM yyyy" }}</td>
        <td>
          <button
            class="edit-btn"
            [routerLink]="['../book_update', Product.product_id]"
          >
            <i class="ri-edit-box-fill"></i> Edit
          </button>
          <button class="delete-btn" (click)="deleteBooks(Product.product_id)">
            <i class="ri-delete-bin-fill"></i> Delete
          </button>
        </td>
      </tr>
      
      <!-- Add more rows as needed -->
    </tbody>
  </table>
</div>
<mat-paginator style="background-color: white; color: black; margin-top: 1vw; width: 100%;"
  [length]="totalRecords"
  [pageSize]="pageSize"
  (page)="onPageChange($event)"
>
</mat-paginator>
