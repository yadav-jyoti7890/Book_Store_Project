

<header>
    <h1>Category Management</h1>
</header>

<section class="category-form">
    <h2>Add/Edit Category</h2>

    <form #categoryData (ngSubmit)="addCategory()" enctype="multipart/form-data">
        <div class="form-group">
            <label>Category Name <span class="required">*</span></label>
            <input type="text" placeholder="Enter category name" name="category_name" required [(ngModel)]="add_category.category_name">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea placeholder="Enter category description" name="Category_dis" [(ngModel)]="add_category.discription"></textarea>
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            <input type="file" name="file" (change)="onFileChange($event)">
        </div>

        <button type="submit" class="save-btn">Save Category</button>
    </form>
</section>
