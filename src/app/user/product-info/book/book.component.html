<div class="book_store">
  <div class="book_in">
    <div class="book_box" *ngFor="let book of product">
      <img
        [src]="book.image ? imageBaseUrl + 'uploads/' + book.image: ''"
        alt="Book image"
        height="100"
        width="100"
      />
      <div class="card-text">
        <h5>title : {{ book.title }}</h5>
        <span>description: {{ book.description }}</span>
        <span>price: {{ book.price }} </span>
        <span>author : {{ book.author }}</span>
        <h6 [routerLink]="['/view_detail', book.product_id]">view</h6>
      </div>
    </div>
  </div>
</div>
