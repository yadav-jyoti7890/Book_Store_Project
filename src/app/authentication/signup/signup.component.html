<div class="form">
    <form [formGroup]="signupForm">
        <h1 class="signup">welcome to <span>Book Store</span></h1>

        <label>Enter username</label>
        <app-validation
            [type]="'text'"
            [placeholder]="'Enter username'"
            name="username"
            required
            [control]="signupForm.controls.username!">
        </app-validation>

        <label for="email">Enter email</label>
        <app-validation
            [type]="'email'"
            [placeholder]="'someone@gmail.com'"
            name="email"
            required
            [control]="signupForm.controls.email!">
        </app-validation>

        <label for="password">Enter password</label>

        <div class="password_sec">
            <i
                class="ri-eye-line"
                (click)="togglePasswordVisibility()"
                [ngClass]="{
          'ri-eye-line': !isPasswordVisible,
          'ri-eye-off-line': isPasswordVisible
        }"></i>
            <app-validation
                [type]="'password'"
                [placeholder]="'password***'"
                name="password"
                required
                [control]="signupForm.controls.password!">
            </app-validation>
        </div>

        <div class="flex">
            <p>Have you any account?</p>
            <a (click)="toggle('login')">Signin</a>
        </div>
        <button type="submit" (click)="register()"
            [disabled]="signupForm.invalid">Signup</button>
    </form>
</div>
}

<div *ngIf="isActive === 'login'" class="form">
  <form [formGroup]="loginForm">
    <h1 class="header1">welcome to <span>Book Store</span></h1>

    <label for="email">Enter email</label>
    <app-validation
      [type]="'email'"
      [placeholder]="'someone@gmail.com'"
      name="email"
      required
      [control]="loginForm.controls.email!">
    </app-validation>

    <label for="password">Enter password</label>
    <div class="password_sec">
      <i
        class="ri-eye-line"
        (click)="togglePasswordVisibility()"
        [ngClass]="{
          'ri-eye-line': !isPasswordVisible,
          'ri-eye-off-line': isPasswordVisible
        }"></i>
      <app-validation
        [type]="'password'"
        [placeholder]="'password***'"
        name="password"
        required
        [control]="loginForm.controls.password!">
      </app-validation>
    </div>

    <div class="flex">
      <p>have you any account</p>
      <a (click)="toggle('signup')">signup</a>
    </div>

    <button
      type="submit"
      (click) = "login()"
      [disabled]="loginForm.invalid">
      SignIn
    </button>
  </form>
</div>
